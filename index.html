<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Eli's Weekly Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#121216;--s1:#1b1b22;--s2:#24242e;--line:#2f2f3b;--text:#ececf3;--muted:#8d8da1;--accent:#8b7cf6;--accent2:#6d5ce0;--hot:#ff8a73;--ok:#6fd3a0;--star:#ffcf5c}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--text);font-family:'Vazirmatn',Tahoma,sans-serif;line-height:1.7;
  padding:18px 14px calc(110px + env(safe-area-inset-bottom));padding-top:max(18px,env(safe-area-inset-top))}
.wrap{max-width:640px;margin:0 auto}
button,input{font-family:inherit;font-size:1rem;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

h1{font-size:1.8rem;font-weight:800;direction:ltr;text-align:right}
h1 span{color:var(--accent)}
.sub{color:var(--muted);font-size:.9rem;margin-bottom:12px}

.prio{background:linear-gradient(160deg,#2a2236,#1d1b26 60%);border:1px solid #4a3d6e;border-radius:18px;padding:14px;margin-bottom:16px}
.prio-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.prio-head h2{font-size:1.05rem}
.clock{font-weight:700;font-size:.82rem;padding:3px 10px;border-radius:99px;background:rgba(139,124,246,.15);color:var(--accent)}
.clock.late{background:rgba(255,138,115,.15);color:var(--hot)}
.clock.done{background:rgba(111,211,160,.15);color:var(--ok)}
.bar{height:5px;background:var(--s2);border-radius:9px;margin:10px 0}
.bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:9px;transition:width .4s}
.hint{color:var(--muted);font-size:.85rem}

.tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;min-width:64px;background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:6px 8px;font-size:.9rem;text-align:center}
.tab small{display:block;font-size:.7rem;color:var(--muted);line-height:1.3}
.tab.today{border-color:#5a4d94}
.tab.active{background:var(--accent2);border-color:var(--accent2);color:#fff}
.tab.active small{color:#ddd8ff}

.panel{background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:14px}
.panel-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.panel-head h2{font-size:1.1rem}.panel-head span{color:var(--muted);font-size:.82rem}

ul{list-style:none;padding:0;display:flex;flex-direction:column;gap:8px}
li.task{display:flex;align-items:center;gap:10px;background:var(--s2);border-radius:14px;padding:6px 10px;min-height:54px}
li.task input[type=checkbox]{appearance:none;-webkit-appearance:none;flex:none;width:28px;height:28px;border-radius:9px;
  border:2px solid #4a4a5c;position:relative;cursor:pointer;transition:all .2s}
li.task input[type=checkbox]:checked{background:var(--accent);border-color:var(--accent)}
li.task input[type=checkbox]:checked::after{content:"";position:absolute;left:8px;top:3px;width:6px;height:12px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.body{flex:1;min-width:0;cursor:text;padding:4px 0}
.title{word-break:break-word}
.time{font-size:.78rem;color:var(--accent);direction:ltr;display:inline-block}
li.done .title{text-decoration:line-through;color:#6a6a7c}
li.done .time{color:#6a6a7c}
.ib{width:40px;height:40px;border-radius:10px;color:var(--muted);font-size:1.15rem;flex:none}
.ib:hover{background:var(--line)}
.ib.on{color:var(--star)}
.ib.del:hover{color:var(--hot)}
li.edit{flex-wrap:wrap;padding:10px}
li.edit input[type=text]{flex:1 1 150px}
input[type=text],input[type=time]{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:9px 12px;min-width:0}
input[type=time]{color-scheme:dark;direction:ltr}
.btn{background:var(--accent2);color:#fff;border-radius:12px;padding:9px 18px;font-weight:700}
.btn.grey{background:var(--line)}
.empty{color:var(--muted);text-align:center;padding:16px 6px;font-size:.92rem}

.addbar{position:fixed;left:0;right:0;bottom:0;background:rgba(18,18,22,.94);backdrop-filter:blur(8px);
  border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom))}
.addbar form{max-width:640px;margin:0 auto;display:flex;gap:8px;align-items:center}
.addbar input[type=text]{flex:1}
.addbar input[type=time]{width:112px;display:none}
.addbar.timed input[type=time]{display:block}
.addbar .ib{background:var(--s2)}
.addbar .btn{width:46px;height:44px;padding:0;font-size:1.4rem;line-height:1}

.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:#2e2a45;border:1px solid #5a4d94;
  padding:8px 16px;border-radius:14px;opacity:0;pointer-events:none;transition:all .3s;max-width:92vw;text-align:center;font-size:.92rem;z-index:9;display:flex;gap:12px;align-items:center}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{color:var(--accent);font-weight:700}

body.locked .wrap,body.locked .addbar{display:none}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tools{display:flex;gap:4px}
.tools .ib{background:var(--s1);border:1px solid var(--line)}
.lock{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px}
.lock[hidden]{display:none}
.lockcard{width:100%;max-width:360px;background:var(--s1);border:1px solid var(--line);border-radius:20px;padding:22px;display:flex;flex-direction:column;gap:10px;text-align:center}
.lockcard[hidden],.lockcard input[hidden],.lockcard button[hidden]{display:none}
.lockcard .lk{font-size:2.2rem}
.lockcard h2{font-size:1.15rem}
.lockcard input{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 12px;text-align:center}
.err{color:var(--hot);font-size:.85rem;min-height:1.3em}
.link{color:var(--muted);font-size:.82rem;text-decoration:underline}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body class="locked">
<div class="lock" id="lock" hidden>
  <div class="lockcard">
    <div class="lk">🔒</div>
    <h2 id="lkTitle"></h2>
    <p class="hint" id="lkMsg"></p>
    <input type="password" id="pOld" autocomplete="current-password">
    <input type="password" id="pNew" placeholder="رمز جدید" autocomplete="new-password">
    <input type="password" id="pNew2" placeholder="تکرار رمز جدید" autocomplete="new-password">
    <p class="err" id="lkErr" role="alert"></p>
    <button class="btn" id="lkOk" type="button"></button>
    <button class="btn grey" id="lkCancel" type="button" hidden>انصراف</button>
    <button class="link" id="lkForgot" type="button" hidden>رمز را فراموش کردم</button>
  </div>
</div>
<div class="wrap">
  <div class="top"><h1>Eli's <span>Weekly</span> Planner</h1>
    <div class="tools"><button class="ib" id="chgBtn" type="button" title="تغییر رمز" aria-label="تغییر رمز">🔑</button><button class="ib" id="lockBtn" type="button" title="قفل کردن" aria-label="قفل کردن">🔒</button></div></div>
  <p class="sub">برنامه‌ریزی روزانه برای نجات از الگوهای دامن، جغرافیا و شلوغی‌ها! ✨</p>

  <section class="prio" aria-labelledby="pt">
    <div class="prio-head"><h2 id="pt">⭐ حتماً تا ۱۱ شب امروز</h2><span class="clock" id="clock"></span></div>
    <div class="bar"><i id="pbar"></i></div>
    <ul id="plist"></ul>
  </section>

  <nav class="tabs" id="tabs" aria-label="روزهای هفته"></nav>
  <section class="panel">
    <div class="panel-head"><h2 id="dayTitle"></h2><span id="dayCount"></span></div>
    <ul id="list"></ul>
  </section>
</div>

<div class="addbar" id="addbar">
  <form id="form">
    <input type="text" id="text" placeholder="کار جدید بنویس و Enter بزن…" maxlength="120" aria-label="کار جدید" enterkeyhint="done">
    <input type="time" id="time" aria-label="ساعت">
    <button class="ib" id="tbtn" type="button" title="تعیین ساعت" aria-label="تعیین ساعت">⏰</button>
    <button class="btn" id="addBtn" type="button" aria-label="افزودن">+</button>
  </form>
</div>
<div class="toast" id="toast" role="status"><span id="tmsg"></span><button id="undo" type="button" hidden>برگردان</button></div>

<script>
const DAYS=['شنبه','یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه'];
const KEY='eli-weekly-planner-v1';
const todayIdx=()=>(new Date().getDay()+1)%7;
const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const fa=n=>Number(n).toLocaleString('fa-IR');
const faT=t=>t.replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const $=id=>document.getElementById(id);

let state={days:DAYS.map(()=>[])};
try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.days)&&s.days.length===7)state=s}catch(e){}
// سازگاری با نسخه قبل: کارهای ویژه قدیمی به لیست امروز منتقل می‌شوند
if(Array.isArray(state.prio)){
  state.prio.filter(p=>p.date===todayStr()).forEach(p=>state.days[todayIdx()].push({id:p.id,text:p.text,time:'',done:p.done,prio:true}));
  delete state.prio;
}
state.days.forEach(d=>d.forEach(t=>{if(t.prio===undefined)t.prio=false}));
let current=todayIdx(),editing=null,timeOn=false;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}};

function el(tag,props,...kids){const e=document.createElement(tag);Object.assign(e,props||{});kids.forEach(k=>e.append(k));return e}

let tT,lastDel=null;
function toast(msg,undo){
  $('tmsg').textContent=msg;$('undo').hidden=!undo;$('undo').onclick=()=>{undo();$('toast').classList.remove('show')};
  $('toast').classList.add('show');clearTimeout(tT);tT=setTimeout(()=>$('toast').classList.remove('show'),undo?5000:2400);
}

function row(t,dayIdx,compact){
  const list=state.days[dayIdx];
  if(editing===t.id){
    const li=el('li',{className:'task edit'});
    const tx=el('input',{type:'text',value:t.text,maxLength:120});
    const tm=el('input',{type:'time',value:t.time||''});
    const ok=el('button',{className:'btn',type:'button',textContent:'ذخیره'});
    const no=el('button',{className:'btn grey',type:'button',textContent:'لغو'});
    ok.onclick=()=>{const v=tx.value.trim();if(v){t.text=v;t.time=tm.value}editing=null;save();render()};
    no.onclick=()=>{editing=null;render()};
    tx.onkeydown=e=>{if(e.key==='Enter')ok.click();if(e.key==='Escape')no.click()};
    li.append(tx,tm,ok,no);setTimeout(()=>tx.focus(),0);return li;
  }
  const li=el('li',{className:'task'+(t.done?' done':'')});
  const cb=el('input',{type:'checkbox',checked:t.done});cb.setAttribute('aria-label','انجام شد');
  cb.onchange=()=>{t.done=cb.checked;save();render()};
  const body=el('div',{className:'body',title:'برای ویرایش بزن'},el('div',{className:'title',textContent:t.text}));
  if(t.time)body.append(el('span',{className:'time',textContent:faT(t.time)}));
  body.onclick=()=>{editing=t.id;render()};
  const star=el('button',{className:'ib'+(t.prio?' on':''),type:'button',textContent:t.prio?'★':'☆',title:'مهم (تا ۱۱ شب)'});
  star.setAttribute('aria-label','مهم');
  star.onclick=()=>{t.prio=!t.prio;save();render()};
  li.append(cb,body);
  if(!compact||true)li.append(star);
  if(!compact){
    const del=el('button',{className:'ib del',type:'button',textContent:'✕',title:'حذف'});del.setAttribute('aria-label','حذف');
    del.onclick=()=>{const i=list.indexOf(t);list.splice(i,1);save();render();toast('کار حذف شد',()=>{list.splice(i,0,t);save();render()})};
    li.append(del);
  }
  return li;
}

function render(){
  // تب‌ها
  const nav=$('tabs');nav.textContent='';
  DAYS.forEach((d,i)=>{
    const open=state.days[i].filter(t=>!t.done).length;
    const b=el('button',{type:'button',className:'tab'+(i===current?' active':'')+(i===todayIdx()?' today':'')});
    b.append(d,el('small',{textContent:i===todayIdx()?'امروز':(open?fa(open)+' کار':'—')}));
    b.onclick=()=>{current=i;editing=null;render()};nav.append(b);
  });
  // روز انتخاب‌شده
  const list=state.days[current];
  $('dayTitle').textContent=DAYS[current];
  const dn=list.filter(t=>t.done).length;
  $('dayCount').textContent=list.length?fa(dn)+' از '+fa(list.length)+' انجام شد':'';
  const ul=$('list');ul.textContent='';
  if(!list.length)ul.append(el('li',{className:'empty',textContent:'خالیه! پایین صفحه اولین کار '+DAYS[current]+' رو بنویس.'}));
  [...list].sort((a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99')).forEach(t=>ul.append(row(t,current)));
  // کارهای مهم امروز
  const ti=current,isToday=ti===todayIdx(),pr=state.days[ti].filter(t=>t.prio);
  $('pt').textContent=isToday?'⭐ حتماً تا ۱۱ شب امروز':'⭐ کارهای مهمِ '+DAYS[ti];
  const pu=$('plist');pu.textContent='';
  if(!pr.length)pu.append(el('li',{className:'hint',textContent:'ستاره ☆ کنار هر کار رو بزن تا اینجا بیاد.'}));
  pr.forEach(t=>pu.append(row(t,ti,true)));
  const pd=pr.filter(t=>t.done).length;
  $('pbar').style.width=(pr.length?pd/pr.length*100:0)+'%';
  clock();
}
function clock(){
  const c=$('clock'),pr=state.days[todayIdx()].filter(t=>t.prio),left=pr.filter(t=>!t.done).length;
  c.className='clock';c.hidden=current!==todayIdx();
  if(pr.length&&!left){c.textContent='همه انجام شد 🎉';c.classList.add('done');return}
  const end=new Date();end.setHours(23,0,0,0);const m=Math.round((end-new Date())/60000);
  if(m<=0){c.textContent='ساعت ۱۱ گذشته';c.classList.add('late');return}
  const h=Math.floor(m/60);c.textContent=(h?fa(h)+' ساعت و ':'')+fa(m%60)+' دقیقه مانده';
}

$('tbtn').onclick=()=>{timeOn=!timeOn;$('addbar').classList.toggle('timed',timeOn);if(timeOn)$('time').focus();else $('time').value=''};
function addTask(){
  const v=$('text').value.trim();
  if(!v){$('text').focus();return}
  state.days[current].push({id:uid(),text:v,time:$('time').value,done:false,prio:false});
  $('text').value='';$('time').value='';save();render();$('text').focus();
}
$('form').addEventListener('submit',e=>e.preventDefault());
$('addBtn').addEventListener('click',addTask);
$('text').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing){e.preventDefault();addTask()}});
render();setInterval(clock,30000);
// ===== قفل با رمز =====
const AKEY='eli-weekly-planner-auth',enc=new TextEncoder();
let auth=null,mode='login';
try{auth=JSON.parse(localStorage.getItem(AKEY))}catch(e){}
async function hashPw(pw,salt){
  try{
    if(window.crypto&&crypto.subtle){
      const k=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveBits']);
      const b=await crypto.subtle.deriveBits({name:'PBKDF2',salt:enc.encode(salt),iterations:150000,hash:'SHA-256'},k,256);
      return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');
    }
  }catch(e){}
  let a=0xdeadbeef,c=0x41c6ce57;const s=salt+':'+pw;
  for(let i=0;i<s.length;i++){const x=s.charCodeAt(i);a=Math.imul(a^x,2654435761);c=Math.imul(c^x,1597334677)}
  a=Math.imul(a^(a>>>16),2246822507)^Math.imul(c^(c>>>13),3266489909);
  c=Math.imul(c^(c>>>16),2246822507)^Math.imul(a^(a>>>13),3266489909);
  return 'f'+(c>>>0).toString(16)+(a>>>0).toString(16);
}
const lkErr=m=>$('lkErr').textContent=m;
function showLock(m){
  mode=m;lkErr('');
  ['pOld','pNew','pNew2'].forEach(i=>{$(i).value='';$(i).hidden=true});
  $('lkCancel').hidden=m!=='change';$('lkForgot').hidden=m!=='login';
  if(m==='setup'){
    $('lkTitle').textContent='یه رمز برای خودت بساز';
    $('lkMsg').textContent='فقط با همین رمز می‌تونی وارد برنامه بشی. بعداً هر وقت خواستی با 🔑 عوضش کن.';
    $('pNew').hidden=$('pNew2').hidden=false;$('lkOk').textContent='ثبت رمز و ورود';
  }else if(m==='login'){
    $('lkTitle').textContent='برنامه قفله';$('lkMsg').textContent='رمزت رو وارد کن.';
    $('pOld').placeholder='رمز عبور';$('pOld').hidden=false;$('lkOk').textContent='ورود';
  }else{
    $('lkTitle').textContent='تغییر رمز';$('lkMsg').textContent='';
    $('pOld').placeholder='رمز فعلی';$('pOld').hidden=$('pNew').hidden=$('pNew2').hidden=false;$('lkOk').textContent='ذخیره رمز جدید';
  }
  if(m!=='change')document.body.classList.add('locked');
  $('lock').hidden=false;
  setTimeout(()=>$(m==='setup'?'pNew':'pOld').focus(),50);
}
function unlock(){
  $('lock').hidden=true;document.body.classList.remove('locked');
  try{sessionStorage.setItem('eli-unlocked','1')}catch(e){}
}
async function lkSubmit(){
  lkErr('');const o=$('pOld').value,n=$('pNew').value,n2=$('pNew2').value;
  if(mode==='login'){
    if(await hashPw(o,auth.salt)===auth.hash)unlock();else{lkErr('رمز اشتباهه 🙈');$('pOld').value='';$('pOld').focus()}
    return;
  }
  if(mode==='change'&&await hashPw(o,auth.salt)!==auth.hash){lkErr('رمز فعلی اشتباهه');return}
  if(n.length<4){lkErr('رمز باید حداقل ۴ کاراکتر باشه');return}
  if(n!==n2){lkErr('تکرار رمز با رمز بالا یکی نیست');return}
  const salt=uid()+uid();
  auth={salt,hash:await hashPw(n,salt)};
  try{localStorage.setItem(AKEY,JSON.stringify(auth))}catch(e){}
  if(mode==='change'){$('lock').hidden=true;toast('رمز تغییر کرد ✅')}else unlock();
}
$('lkOk').addEventListener('click',lkSubmit);
$('lkCancel').addEventListener('click',()=>{$('lock').hidden=true});
['pOld','pNew','pNew2'].forEach(i=>$(i).addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing){e.preventDefault();lkSubmit()}}));
$('lkForgot').addEventListener('click',()=>{
  if(confirm('اگه رمز رو ریست کنی، همه کارها و رمز پاک می‌شن. مطمئنی؟')){
    try{localStorage.removeItem(KEY);localStorage.removeItem(AKEY);sessionStorage.removeItem('eli-unlocked')}catch(e){}
    location.reload();
  }
});
$('lockBtn').addEventListener('click',()=>{try{sessionStorage.removeItem('eli-unlocked')}catch(e){}showLock('login')});
$('chgBtn').addEventListener('click',()=>showLock('change'));
(function(){
  if(!auth||!auth.hash){showLock('setup');return}
  let ok=false;try{ok=sessionStorage.getItem('eli-unlocked')==='1'}catch(e){}
  if(ok)document.body.classList.remove('locked');else showLock('login');
})();

</script>
</body>
</html>
